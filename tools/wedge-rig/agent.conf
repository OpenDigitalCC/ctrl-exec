# Wedge rig agent config: executor enabled, a run_as profile for the test script.
port = 7443
cert = /etc/ctrl-exec-agent/agent.crt
key  = /etc/ctrl-exec-agent/agent.key
ca   = /etc/ctrl-exec-agent/ca.crt

script_dirs = /opt/ctrl-exec-scripts

executor_socket = /run/ctrl-exec-agent/exec.sock

[tags]
env = wedge-rig

[profile default]
run_as            = nobody
no_new_privileges = yes

# The test script is root:root 0755 (as the installer lays out the
# script directory); run_as is the agent user here.
[profile rig]
run_as            = ctrl-exec-agent
no_new_privileges = yes
